function u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function open(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);var got=null;
  for(var j=0;j<P.w.length&&!got;j++){try{var W=P.w[j];var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(W.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    got=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(W.i)},k,u(W.w))));}catch(x){}}
  if(!got)throw new Error('bad');
  var ck=await crypto.subtle.importKey('raw',u(got.k),{name:'AES-GCM'},false,['decrypt']);
  var raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},ck,u(P.c));var html=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  if(got.m)window.ATT_MGR=got.m;var a=document.getElementById('app');a.innerHTML=html;
  a.querySelectorAll('script').forEach(function(o){var s=document.createElement('script');s.textContent=o.textContent;o.replaceWith(s);});
  document.getElementById('lock').remove();a.hidden=false;
  if(got.n){window.ATT_USER=got.n;var r=document.getElementById('rName');if(r&&!r.value.trim()){r.value=got.n;r.dispatchEvent(new Event('input',{bubbles:true}));}}
}
var f=document.getElementById('lf'),e=document.getElementById('e');
f.addEventListener('submit',async function(ev){ev.preventDefault();e.textContent='';var b=document.getElementById('go');b.disabled=true;b.textContent='جارٍ الفتح…';
  var pw=document.getElementById('pw').value;
  try{await open(pw);try{if(document.getElementById('rm').checked)localStorage.setItem('attQt',pw);}catch(x){}}
  catch(x){e.textContent='كلمة السر غير صحيحة.';b.disabled=false;b.textContent='دخول';}
});
try{var s=localStorage.getItem('attQt');if(s)open(s).catch(function(){try{localStorage.removeItem('attQt');}catch(x){}});}catch(x){}
})();
